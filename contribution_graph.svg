<svg width="100%" height="220" viewBox="0 0 850 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0B0D"/>
      <stop offset="100%" stop-color="#141419"/>
    </linearGradient>

    <!-- Area Gradient with Animation -->
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#00D9FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Line Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      /* Infinite Continuous Pulse Animation */
      @keyframes pulseGlow {
        0%, 100% {
          stroke-width: 3.5px;
          filter: drop-shadow(0 0 3px #00D9FF);
          opacity: 0.9;
        }
        50% {
          stroke-width: 4.5px;
          filter: drop-shadow(0 0 8px #00D9FF);
          opacity: 1;
        }
      }

      /* Infinite Dot Ripple */
      @keyframes dotRipple {
        0%, 100% {
          r: 4.5px;
          fill: #8FF1F7;
          filter: drop-shadow(0 0 2px #00D9FF);
        }
        50% {
          r: 6.5px;
          fill: #FFFFFF;
          filter: drop-shadow(0 0 10px #00D9FF);
        }
      }

      /* Infinite Grid Scanline Animation */
      @keyframes scanline {
        0% { transform: translateY(-10px); opacity: 0; }
        50% { opacity: 0.15; }
        100% { transform: translateY(180px); opacity: 0; }
      }

      .animated-line {
        animation: pulseGlow 2.5s ease-in-out infinite;
      }

      .active-dot {
        animation: dotRipple 2s ease-in-out infinite;
      }

      .scan-beam {
        animation: scanline 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Card with Border -->
  <rect x="2" y="2" width="846" height="216" rx="8" fill="url(#bgGrad)" stroke="#1F2933" stroke-width="1.5"/>

  <!-- Title -->
  <text x="50%" y="28" text-anchor="middle" fill="#00D9FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="0.5">
    Aryaman Garg's Contribution Graph
  </text>

  <!-- Y-Axis Values & Grid Lines -->
  <g stroke="#1F2933" stroke-width="1" stroke-dasharray="3,3" opacity="0.6">
    <!-- 5 -->
    <line x1="75" y1="50" x2="800" y2="50" />
    <!-- 4 -->
    <line x1="75" y1="75" x2="800" y2="75" />
    <!-- 3 -->
    <line x1="75" y1="100" x2="800" y2="100" />
    <!-- 2 -->
    <line x1="75" y1="125" x2="800" y2="125" />
    <!-- 1 -->
    <line x1="75" y1="150" x2="800" y2="150" />
    <!-- 0 Baseline -->
    <line x1="75" y1="175" x2="800" y2="175" stroke="#2D3748" stroke-dasharray="none" stroke-width="1.5"/>
  </g>

  <!-- Y-Axis Labels -->
  <g fill="#00D9FF" font-family="monospace" font-size="11" text-anchor="end" opacity="0.85">
    <text x="65" y="54">5</text>
    <text x="65" y="79">4</text>
